# Alembic configuration.
#
# Note there is deliberately no sqlalchemy.url here. The URL comes from
# app.core.config at runtime (see alembic/env.py), so migrations and the
# application can never disagree about which database they are pointed
# at, and a connection string with a password never lands in the repo.

[alembic]
script_location = alembic

# Timestamped, readable filenames. The default is a bare hash, which
# tells a reviewer nothing about the order or the intent.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# Revisions are written in UTC so their order does not depend on which
# developer's machine generated them.
timezone = UTC

[post_write_hooks]
# Deliberately empty.
#
# A ruff format hook is the obvious thing to put here, and it was tried.
# It does not survive a virtualenv: ruff ships as a standalone binary
# with no console_scripts entrypoint, and the exec hook cannot find it
# on PATH because the venv's Scripts directory is not exported to the
# subprocess. Hardcoding an absolute venv path would break on every
# other machine. A hook that fails every `alembic revision` is worse
# than none, so migrations are formatted by the normal lint step:
#
#     ruff format alembic/versions
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
